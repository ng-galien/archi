<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  <!-- Polyglot: default language (en) lives at root. Only redirect French users to ./fr/. -->
  <meta http-equiv="refresh" content="0; url=./" />
    <title>Redirecting…</title>
    <script>
      (function () {
        try {
          var userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
          // Base path for project pages: keep whatever path we're currently in (e.g., /archi/)
          var path = window.location.pathname || '/';
          // Ensure trailing slash for base
          if (!path.endsWith('/')) path += '/';
          var base = path;
          var isFrench = userLang.startsWith('fr');
          if (isFrench) {
            var target = base + 'fr/';
            window.location.replace(target);
          } else {
            // Stay on default language at root
            if (window.location.pathname !== base) {
              window.location.replace(base);
            }
          }
        } catch (e) {
          // fallback to meta refresh (relative)
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to your language… If nothing happens, visit <a href="./">English</a> or <a href="./fr/">Français</a>.</p>
  </body>
</html>
