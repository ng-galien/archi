<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  <!-- Use a relative redirect so it works under project pages (e.g., /archi/) -->
  <meta http-equiv="refresh" content="0; url=./en/" />
    <title>Redirecting…</title>
    <script>
      (function () {
        try {
          var userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
          // Base path for project pages: keep whatever path we're currently in (e.g., /archi/)
          var path = window.location.pathname || '/';
          // Ensure trailing slash for base
          if (!path.endsWith('/')) path += '/';
          var base = path;
          var lang = userLang.startsWith('fr') ? 'fr' : 'en';
          var target = base + lang + '/';
          window.location.replace(target);
        } catch (e) {
          // fallback to meta refresh (relative)
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to your language… If nothing happens, visit <a href="/en/">English</a> or <a href="/fr/">Français</a>.</p>
  </body>
</html>
