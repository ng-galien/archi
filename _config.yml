title: Archi
description: Bilingual personal coding blog (FR/EN) about software design, modeling, and engineering notes.
# Theme disabled: site uses custom layout and CSS, avoid Cayman warnings
# theme: jekyll-theme-cayman
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
collections:
  articles:
    output: true
plugins:
  - jekyll-polyglot
exclude:
  - .github/
  - README.md
  - _site
  - vendor
  - scripts

# Multilingual via Polyglot
languages: ["en", "fr"]
default_lang: "en"
exclude_from_localization: [".github", "_site", "vendor", "scripts", "assets", "sitemap.xml", "robots.txt"]
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: ""
      type: "articles"
    values:
      layout: default
  - scope:
      path: ""
      type: "posts"
    values:
      layout: default

# Production URL and baseurl (GitHub Pages project)
# Adjust owner/repo if the repository is renamed or moved
url: "https://ng-galien.github.io"
baseurl: "/archi"

# Disable CSS sourcemaps to avoid Jekyll 4 + Polyglot issue
sass:
  sourcemap: never
