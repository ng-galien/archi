name: markdownlint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run markdownlint
        run: |
          npx --yes markdownlint-cli@0.39.0 \
            --config .markdownlint.yml \
            "**/*.md" \
            "!_site/**" "!vendor/**" "!tmp/**" "!**/node_modules/**"
